# ============================================================
# TODO (tiêu chí 12): cấu hình deploy Render (Blueprint) — có thể dùng thay railway.toml
#   services:
#     - type: web, runtime: docker, healthCheckPath: /health
#     - envVars: secret như AGENT_API_KEY dùng `generateValue: true` hoặc `sync: false`,
#       KHÔNG ghi thẳng giá trị
# ============================================================
services:
  - type: web
    name: day14-agent
    runtime: docker
    plan: free
    region: singapore
    rootDir: 06-lab-complete
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-redis
          property: connectionString

  - type: keyvalue
    name: day14-redis
    plan: free
    region: singapore
    ipAllowList: []